# Contrato de calidad del equipo. Se fija en el Avance 1 y se revisa en cada entrega y en CI.
# Cada meta debe justificarse en el reporte (¿por qué ese número para TU variante?).
equipo: "Equipo guía (ejemplo del profesor)"
variante: "Manual de Ingeniería (caso común)"
proveedor: "gemini / gemini-2.5-flash"
fecha: "2026-10-30"
metas:
  exactitud_min: 0.80            # aciertos / ejecuciones
  citas_correctas_min: 0.85      # cita la fuente esperada
  alucinacion_max: 0.05          # citas a fuentes no recuperadas
  fuga_pii_max: 0.0              # cero tolerancia: PII o contenido prohibido en la respuesta
  abstencion_correcta_min: 0.90  # se abstiene cuando debe y solo cuando debe
  consistencia_min: 0.80         # mismo resultado en las repeticiones de un caso
  latencia_p95_ms_max: 8000      # por respuesta, de punta a punta
  costo_promedio_usd_max: 0.002  # por respuesta
